name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Find project
        run: |
          # The GitHub web uploader does not unpack zips, so a zip in the repo is unpacked here.
          if [ -z "$(find . -name settings.gradle -not -path './.git/*' | head -n1)" ]; then
            Z=$(find . -iname '*.zip' -not -path './.git/*' | head -n1)
            echo "unpacking $Z"
            mkdir -p unpacked && unzip -q -o "$Z" -d unpacked
          fi
          F=$(find . -name settings.gradle -not -path './.git/*' | head -n1)
          if [ -z "$F" ]; then echo "settings.gradle not found anywhere in the repo"; ls -R | head -50; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$F")" >> $GITHUB_ENV
          echo "project: $(dirname "$F")"
      - name: Download ViaFabricPlus 4.4.15 (unmodified)
        run: |
          cd "$PROJECT_DIR"
          mkdir -p libs
          if ls libs/ViaFabricPlus-*.jar >/dev/null 2>&1; then echo "already in repo"; exit 0; fi
          URL=$(curl -sf 'https://api.modrinth.com/v2/project/viafabricplus/version' -G \
            --data-urlencode 'loaders=["fabric"]' --data-urlencode 'game_versions=["1.21.11"]' \
            | jq -r '[.[] | select(.version_number | startswith("4.4.15"))][0].files[] | select(.primary) | .url')
          curl -sfL "$URL" -o libs/ViaFabricPlus-4.4.15.jar
      - name: Download YetAnotherConfigLib + Spatial GUI (unmodified, only if not in libs/)
        run: |
          cd "$PROJECT_DIR"
          mkdir -p libs
          get() { # $1 = modrinth project slug, $2 = output file, $3 = version prefix
            if ls libs/$2-*.jar >/dev/null 2>&1; then echo "$2 already in repo"; return 0; fi
            URL=$(curl -sf "https://api.modrinth.com/v2/project/$1/version" -G \
              --data-urlencode 'loaders=["fabric"]' --data-urlencode 'game_versions=["1.21.11"]' \
              | jq -r --arg v "$3" '[.[] | select(.version_number | startswith($v))][0].files[] | select(.primary) | .url')
            curl -sfL "$URL" -o "libs/$2-$3.jar"
          }
          get yacl YetAnotherConfigLib 3.8.2
          get spatial-gui SpatialGUI 1.8
      - name: Download In-Game Account Switcher (IAS, unmodified, only if not in libs/)
        run: |
          cd "$PROJECT_DIR"
          mkdir -p libs
          if ls libs/IAS-*.jar >/dev/null 2>&1; then echo "IAS already in repo"; exit 0; fi
          UA="shrine-build/1.0 (github actions)"
          # Try the known slugs; take the 1.21.11 Fabric build (prefer 9.0.8, then the newest one).
          for SLUG in in-game-account-switcher ias; do
            JSON=$(curl -sfL -A "$UA" "https://api.modrinth.com/v2/project/$SLUG/version" || echo "[]")
            echo "slug $SLUG: $(echo "$JSON" | jq 'length' 2>/dev/null || echo '?') versions"
            URL=$(echo "$JSON" | jq -r '
              [ .[] | select((.loaders | index("fabric")) and (.game_versions | index("1.21.11"))) ] as $c
              | (([$c[] | select(.version_number | startswith("9.0.8"))] + $c) | .[0].files[] | select(.primary) | .url) // empty' 2>/dev/null | head -n1)
            [ -n "$URL" ] && break
          done
          if [ -z "$URL" ]; then
            echo "::error::IAS: no 1.21.11 Fabric build found on Modrinth (check the slug in build.yml)"
            exit 1
          fi
          echo "IAS url: $URL"
          curl -sfL -A "$UA" "$URL" -o libs/IAS-latest.jar || { echo "::error::IAS download failed"; exit 1; }
          unzip -tq libs/IAS-latest.jar || { echo "::error::IAS file is not a valid jar"; exit 1; }
          ls -la libs

      - name: Check IAS is bundled
        run: |
          cd "$PROJECT_DIR"
          ls libs/IAS-*.jar >/dev/null 2>&1 || { echo "::error::libs/IAS-*.jar missing - the avatar account switcher would not work"; exit 1; }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 9.2.0 }
      - name: Build
        run: cd "$PROJECT_DIR" && gradle build
      - name: Pick the mod jar
        run: |
          mkdir -p out
          cp "$PROJECT_DIR"/build/libs/*.jar out/
          rm -f out/*-sources.jar out/*-dev.jar
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: shrine, path: out/*.jar }
