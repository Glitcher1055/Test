name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Find project
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -qo "$z"; done || true
          DIR=$(dirname "$(find . -name build.gradle -not -path './.git/*' | head -1)")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          echo "Project: $DIR"
      - name: Download ViaFabricPlus 4.4.15 (unmodified)
        run: |
          cd "$PROJECT_DIR"
          mkdir -p libs
          if ls libs/ViaFabricPlus-*.jar >/dev/null 2>&1; then echo "already in repo"; exit 0; fi
          URL=$(curl -sf -A "meadow-menu-build" 'https://api.modrinth.com/v2/project/viafabricplus/version' -G \
            --data-urlencode 'loaders=["fabric"]' --data-urlencode 'game_versions=["1.21.11"]' \
            | jq -r '[.[] | select(.version_number | startswith("4.4.15"))][0].files[] | select(.primary) | .url')
          echo "$URL"
          curl -sfL -A "meadow-menu-build" "$URL" -o libs/ViaFabricPlus-4.4.15.jar
          ls -la libs
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 9.2.0 }
      - name: Build
        run: cd "$PROJECT_DIR" && gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: meadow-menu
          path: ${{ env.PROJECT_DIR }}/build/libs/meadow-menu-1.0.0.jar
